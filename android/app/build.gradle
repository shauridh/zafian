plugins {
    id 'com.android.application'
}

def keystorePropertiesFile = rootProject.file('keystore.properties')
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}
def hasReleaseKeystore = keystorePropertiesFile.exists()

android {
    namespace 'com.sabana.pos'
    compileSdk 34

    defaultConfig {
        applicationId 'com.sabana.pos'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0.0'
    }

    if (hasReleaseKeystore) {
        signingConfigs {
            release {
                storeFile rootProject.file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseKeystore) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

gradle.taskGraph.whenReady { graph ->
    if (!hasReleaseKeystore && graph.allTasks.any { task -> task.name.toLowerCase().contains('release') }) {
        throw new GradleException('android/keystore.properties tidak ditemukan. Salin android/keystore.properties.example, isi kredensial, dan letakkan release.keystore di folder android/.')
    }
}
