name: CI

on:
  push:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verifikasi
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      UI_CHECK_OWN_SERVER: '1'
      UI_CHECK_REPORT: artifacts/ui-check-report.json
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Chromium untuk check:ui
        run: bunx playwright install --with-deps chromium

      - name: Typecheck
        run: bun run typecheck

      - name: check:domain
        run: bun run check:domain

      - name: check:runtime
        run: bun run check:runtime

      - name: check:storage
        run: bun run check:storage

      - name: check:ui (Chromium headless)
        run: bun run check:ui

      - name: Unggah laporan check:ui
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-check-report
          path: |
            artifacts/ui-check-report.json
            .screenshots/ui-check/
          if-no-files-found: ignore
          retention-days: 7
